<style>
:root {
  --grafite: #232526;
  --creme:   #fdf5e6;
  --ambar:   #ffcc66;
  --linha:   rgba(253, 245, 230, 0.16);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;

  background: var(--grafite);
  background-image:
    radial-gradient(60rem 40rem at 50% -10%, rgba(255, 204, 102, 0.10), transparent 60%),
    linear-gradient(160deg, #414345, #232526 65%);
  background-attachment: fixed;

  font-family: "Manrope", "Segoe UI", Roboto, system-ui, sans-serif;
  color: var(--creme);
  -webkit-font-smoothing: antialiased;
}

.cartao {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 40px 30px 34px;
  border: 1px solid var(--linha);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.035);
  box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.7);
}

/* ---------- foto ---------- */
.foto {
  display: block;
  width: 168px;
  height: 168px;
  margin: 0 auto;
  border-radius: 50%;
  object-fit: cover;
  object-position: 50% 0%;
  border: 3px solid var(--creme);
  outline: 1px solid rgba(255, 204, 102, 0.55);
  outline-offset: 5px;
}

/* ---------- identificação ---------- */
h1 {
  margin: 26px 0 0;
  font-size: 1.55rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  color: var(--ambar);
}

.legenda {
  margin: 8px 0 0;
  font-size: 0.9rem;
  font-weight: 400;
  color: rgba(253, 245, 230, 0.66);
}

/* ---------- links principais ---------- */
.links {
  display: grid;
  gap: 12px;
  margin-top: 30px;
}

.link {
  display: block;
  padding: 13px 18px;
  border-radius: 10px;
  border: 1px solid var(--linha);
  background: rgba(253, 245, 230, 0.06);
  color: var(--creme);
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-decoration: none;
  transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
}

.link:hover {
  background: rgba(253, 245, 230, 0.13);
  border-color: rgba(253, 245, 230, 0.4);
  transform: translateY(-2px);
}

.link--destaque {
  background: var(--ambar);
  border-color: var(--ambar);
  color: var(--grafite);
}
.link--destaque:hover { background: #ffd782; border-color: #ffd782; }

/* ---------- contato ---------- */
.contato {
  margin-top: 30px;
  padding-top: 24px;
  border-top: 1px solid var(--linha);
  display: grid;
  gap: 12px;
  justify-items: center;
}

.contato a {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--creme);
  font-size: 0.92rem;
  text-decoration: none;
  transition: color .18s ease;
}
.contato a:hover { color: var(--ambar); }

.contato svg {
  width: 17px;
  height: 17px;
  stroke: var(--ambar);
  flex: none;
}

/* ---------- acessibilidade ---------- */
a:focus-visible {
  outline: 2px solid var(--ambar);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  .link { transition: none; }
  .link:hover { transform: none; }
}

@media (max-width: 380px) {
  .cartao { padding: 32px 22px 28px; }
  .foto { width: 140px; height: 140px; }
  h1 { font-size: 1.35rem; }
}
</style>
</head>
